    <!-- Polyfill Promise.try: richiesto da pdfjs-dist v5, disponibile solo in browser recenti.
         Deve essere inline nel <head> per essere eseguito PRIMA del caricamento dei moduli ES. -->
    <script>
      if (typeof Promise.try !== 'function') {
        Promise.try = function (fn) {
          return new Promise(function (resolve) { resolve(); }).then(fn);
        };
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
